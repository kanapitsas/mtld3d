[package]
name = "d3d9"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
authors.workspace = true

# `cdylib` is `d3d9.dll`. The `rlib` is what the native host build
# (`native/`) links into `libd3d9metal`; built for a PE target it goes unused.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bitflags = { workspace = true }
mtld3d-core = { workspace = true }
mtld3d-shared = { workspace = true }
mtld3d-types = { workspace = true }
log = { workspace = true }
rustc-hash = { workspace = true }
xbr = { workspace = true }
xxhash-rust = { workspace = true }

# snmalloc's Apple layer needs `mach_vm`, which iOS does not offer.
[target.'cfg(not(target_os = "ios"))'.dependencies]
snmalloc-rs = { workspace = true }

# A native host build (any target but Windows) records frames as the PE side
# does and adopts guest leases as the native side does, in one copy of the core.
[target.'cfg(not(windows))'.dependencies]
mtld3d-core = { workspace = true, features = ["native-host"] }

[lints]
workspace = true
