# The native host build: `d3d9` and the native runtime linked in process into
# one library, `libd3d9metal`, for an application that is no Windows program
# under Wine (docs/ARCHITECTURE.md "The native host linkage"). A third
# workspace, so the feature it turns on (`native-host` on the runtime and the
# core) never reaches the Wine builds of the other two through Cargo's feature
# unification.
[workspace]
members = ["d3d9metal"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.99"
version = "0.15.1"
license = "Zlib"
description = "Direct3D 9 translation layer backed by Metal, linked into a native host application"
authors = ["Alexander Theissen <alex.theissen@me.com>"]
repository = "https://github.com/athei/mtld3d"
homepage = "https://github.com/athei/mtld3d"

[workspace.dependencies]
d3d9 = { path = "../windows/d3d9" }
mtld3d-core = { path = "../windows/core", features = ["native-host"] }
mtld3d-shared = { path = "../unix/shared" }
mtld3d-types = { path = "../windows/types" }
mtld3d-unix = { path = "../unix/unix", features = ["native-host"] }
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-metal = { version = "0.3", features = ["MTLDevice", "MTLTexture", "MTLPixelFormat"] }
objc2-quartz-core = { version = "0.3", features = ["CAMetalLayer", "CALayer", "objc2-metal", "objc2-core-foundation"] }

# The profiles of the other two workspaces, which this one links: unwinding
# never crosses into the host (`panic = "abort"`), `release` keeps the debug
# assertions the tests run with, and `production` is the shipped build.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
debug = 1
debug-assertions = true
overflow-checks = true

[profile.release.package.snmalloc-sys]
debug = 0

[profile.dev.package.snmalloc-sys]
debug = 0

[profile.release.package.zstd-sys]
debug = 0

[profile.dev.package.zstd-sys]
debug = 0

[profile.production]
inherits = "release"
lto = "fat"
codegen-units = 1
debug-assertions = false
overflow-checks = false

[workspace.lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
missing_safety_doc = "warn"
not_unsafe_ptr_arg_deref = "warn"
transmute_ptr_to_ref = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
